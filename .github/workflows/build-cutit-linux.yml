name: Cut-it Linux beta
on:
  workflow_dispatch:
  push:
    branches: [linux-beta]
permissions:
  contents: read
concurrency:
  group: cutit-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CUTIT_LINUX_OUTPUT: ${{ github.workspace }}/linux-build-output
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare AppImage packager
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool.AppImage" >> "$GITHUB_ENV"
      - name: Build and test Cut-it with verified bundled dependencies
        run: bash scripts/build-cutit-linux-runtime.sh
      - name: Upload Linux beta
        uses: actions/upload-artifact@v4
        with:
          name: Cut-it-linux-x86_64-beta
          path: |
            dist/*-linux-x86_64.AppImage
            dist/*-linux-x86_64.tar.xz
            dist/*-linux-x86_64.deb
            dist/SHA256SUMS.txt
            dist/SOURCE-COMMIT.txt
            dist/RUNTIME-SOURCE.txt
            dist/build-image.json
            dist/tests.log
            dist/package-tests.log
          if-no-files-found: error
      - name: Upload corresponding sources
        uses: actions/upload-artifact@v4
        with:
          name: Cut-it-linux-corresponding-sources
          path: dist/*-sources.tar.xz
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cut-it-linux-build-logs
          path: |
            linux-build-output/*.log
            linux-build-output/build-image.json
          if-no-files-found: ignore
  publish-apt:
    if: github.ref == 'refs/heads/linux-beta'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Cut-it-linux-*
          path: apt-input
          merge-multiple: true
      - name: Build and verify signed APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.CUTIT_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_KEY" || { echo 'Configure CUTIT_APT_SIGNING_KEY first.' >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg
          export GNUPGHOME="$RUNNER_TEMP/cutit-apt-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          bash scripts/build-cutit-apt-repository.sh apt-input apt-site
      - name: Test APT installation on clean Ubuntu 24.04
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/apt-site:/repo:ro" -v "$PWD/scripts:/checks:ro" \
            ubuntu:24.04 bash /checks/test-cutit-apt-repository.sh 2>&1 | tee apt-install-tests.log
      - name: Upload APT installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cut-it-apt-install-logs
          path: apt-install-tests.log
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apt-site
      - name: Publish APT repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public APT installation
        run: |
          set -euo pipefail
          key_sha256=$(sha256sum apt-site/cut-it-archive-keyring.gpg | cut -d ' ' -f1)
          docker run --rm -v "$PWD/scripts:/checks:ro" -e EXPECTED_APT_KEY_SHA256="$key_sha256" \
            ubuntu:24.04 bash /checks/test-cutit-apt-repository.sh https://munleg.github.io/cut-it \
            2>&1 | tee apt-public-tests.log
      - name: Upload public APT installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cut-it-apt-public-install-logs
          path: apt-public-tests.log
          if-no-files-found: ignore
